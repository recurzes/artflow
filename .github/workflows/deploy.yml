name: Deploy to Dokploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/artflow:latest
            ${{ secrets.DOCKER_USERNAME }}/artflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deployment (API)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" \
            "${{ secrets.DOKPLOY_WEBHOOK_URL_API }}"

      - name: Trigger Dokploy deployment (Bot)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" \
            "${{ secrets.DOKPLOY_WEBHOOK_URL_BOT }}"

      - name: Trigger Dokploy deployment (Workers)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" \
            "${{ secrets.DOKPLOY_WEBHOOK_URL_WORKERS }}"