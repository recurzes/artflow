name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artflow
          POSTGRES_PASSWORD: artflow
          POSTGRES_DB: artflow
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U artflow -d artflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: uv run --frozen --extra dev ruff check .

      - name: Test
        run: uv run --frozen --extra dev pytest

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Reports known vulnerabilities in uv.lock. It does not block the deploy: a new
    # advisory against an unchanged lockfile should not stop an unrelated fix.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.17"

      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-hashes --no-emit-project -o requirements.txt
          uvx pip-audit -r requirements.txt --no-deps --disable-pip

  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/artflow:latest
            ${{ secrets.DOCKER_USERNAME }}/artflow:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Dokploy deployment (API)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" \
            "${{ secrets.DOKPLOY_WEBHOOK_URL_API }}"

      - name: Trigger Dokploy deployment (Bot)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" \
            "${{ secrets.DOKPLOY_WEBHOOK_URL_BOT }}"

      - name: Trigger Dokploy deployment (Workers)
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.DOKPLOY_TOKEN }}" \
            "${{ secrets.DOKPLOY_WEBHOOK_URL_WORKERS }}"
