[project]
name = "artflow"
version = "0.1.0"
description = "Discord-native art commission SaaS bot"
requires-python = ">=3.12"
dependencies = [
    # Bot
    "discord-py>=2.3",
    "aiohttp>=3.9",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "gunicorn>=22.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    # Database
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Cache
    "redis>=5.0",
    # Workers
    "celery[redis]>=5.4",
    "Pillow>=10.3",
    # Supabase (Storage client)
    "supabase>=2.4",
    # Utilities
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    # Observability
    "sentry-sdk[fastapi,celery]>=2.0",
    # Rate limiting
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "api", "workers", "shared"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
