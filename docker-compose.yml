# Local development.
#   docker compose up -d postgres redis      -> infrastructure only, run the app with uv
#   docker compose --profile app up --build  -> everything in containers

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  # Inside the compose network the services are reached by name, not localhost.
  environment:
    DATABASE_URL: postgresql+asyncpg://artflow:artflow@postgres:5432/artflow
    REDIS_URL: redis://redis:6379/0
    API_BASE_URL: http://api:8000
  volumes:
    - .:/app
  profiles: [ "app" ]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artflow
      POSTGRES_PASSWORD: artflow
      POSTGRES_DB: artflow
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U artflow -d artflow" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    <<: *app
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  bot:
    <<: *app
    command: python -m bot.main
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started

  worker:
    <<: *app
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      redis:
        condition: service_healthy

  beat:
    <<: *app
    command: celery -A workers.celery_app beat --loglevel=info
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
